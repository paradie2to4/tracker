# Apache prefork limits sized for the container's memory.
#
# Each worker is one PHP process (roughly 30-50 MB with this app). The
# Debian default of 150 workers would exhaust a 512 MB instance under load
# and crash it; with a cap, extra requests wait briefly in the queue instead.
#
# APACHE_MAX_REQUEST_WORKERS is set in the Dockerfile (default 8) and can be
# raised on bigger instances, e.g. ~16 on 1 GB, ~40 on 2 GB.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    ServerLimit              ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    # Recycle workers periodically to keep memory usage flat.
    MaxConnectionsPerChild   1000
</IfModule>
