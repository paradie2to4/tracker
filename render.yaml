# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked `sync: false` are entered in the Render dashboard when the
# Blueprint is first applied. They are never stored in this file.
services:
  - type: web
    name: productsphere
    runtime: docker
    plan: free
    # Frankfurt is the Render region closest to Rwanda; create the Neon
    # database in AWS eu-central-1 (Frankfurt) as well to keep latency low.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ProductSphere
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Kigali
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      # Concurrent PHP workers. 8 fits the free 512 MB instance; raise it
      # with the instance size (~16 for 1 GB, ~40 for 2 GB).
      - key: APACHE_MAX_REQUEST_WORKERS
        value: "8"
      # Loads the demo supply chain on first boot (idempotent; no known-password accounts).
      - key: SEED_DEMO_DATA
        value: "true"
      # Passwords for admin@productsphere.demo / staff@productsphere.demo.
      # Leave empty to disable sign-in to the demo accounts.
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false
